version: 2

models:
  - name: time_spine
    description: Daily time spine required for governed time-series metric queries.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        description: Calendar date at daily granularity.
        granularity: day

  - name: payments
    description: Payment-grain fact model added locally for governed revenue metrics.
    columns:
      - name: payment_id
        description: Unique payment identifier.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Order associated with the payment.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('orders')
                field: order_id
      - name: customer_id
        description: Customer associated with the order.
      - name: order_date
        description: Date on which the associated order was placed.
      - name: order_status
        description: Current status of the associated order.
      - name: payment_method
        description: Method used for the payment.
      - name: amount
        description: Payment amount in dollars.
        data_tests:
          - not_null

semantic_models:
  - name: customers
    description: Customer-grain semantic model.
    model: ref('customers')
    defaults:
      agg_time_dimension: first_order_date
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: first_order_date
        description: Date of the customer's first order; null when the customer has no orders.
        type: time
        expr: first_order
        type_params:
          time_granularity: day
    measures:
      - name: customer_count
        description: Distinct count of customers.
        agg: count_distinct
        expr: customer_id

  - name: orders
    description: Order-grain semantic model.
    model: ref('orders')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
        expr: status
      - name: customer_id
        type: categorical
    measures:
      - name: order_count
        description: Distinct count of orders.
        agg: count_distinct
        expr: order_id
      - name: average_order_value
        description: Average total payment amount per order in dollars.
        agg: average
        expr: amount

  - name: payments
    description: Payment-grain semantic model used for governed revenue analysis.
    model: ref('payments')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: payment
        type: primary
        expr: payment_id
      - name: order
        type: foreign
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: order_status
        type: categorical
      - name: customer_id
        type: categorical
      - name: payment_method
        type: categorical
    measures:
      - name: total_revenue
        description: Sum of payment amounts in dollars.
        agg: sum
        expr: amount

metrics:
  - name: customers
    description: Number of distinct customers.
    label: Customers
    type: simple
    type_params:
      measure: customer_count

  - name: orders
    description: Number of distinct orders.
    label: Orders
    type: simple
    type_params:
      measure: order_count

  - name: total_revenue
    description: Governed total revenue calculated from successful payment records in the demo data.
    label: Total Revenue
    type: simple
    type_params:
      measure: total_revenue

  - name: average_order_value
    description: Average total payment amount per order.
    label: Average Order Value
    type: simple
    type_params:
      measure: average_order_value
